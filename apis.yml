aid: lance
name: Lance
description: >-
  Lance (Lance AI, Inc.) is a Y Combinator Winter 2026 company building
  autonomous AI agents for hotel operations. Its platform handles guest
  interactions and back-of-house coordination end to end: a Receptionist agent
  answers guest calls, SMS, email, and hotel messaging platforms 24/7 in
  multiple languages, resolving questions and routing service requests; a Sales
  agent responds to booking inquiries and RFPs, qualifies leads, and follows up
  on opportunities; and Lance Pad is a tablet-based coordination surface that
  replaces walkie-talkies and tracks guest requests, housekeeping, work orders,
  and scheduling in real time. Lance reports use across brands including
  Marriott, Hilton, and Hyatt and more than 50 hotels, citing an 89% call
  success rate and a 30%+ reduction in front-desk call volume. Architecturally
  the company is notable for deliberately avoiding integration APIs: it uses
  computer-use and computer-vision agents to drive legacy property management,
  task, and reservation systems through their user interfaces rather than
  through vendor APIs. Lance is surfaced here as a portfolio company of Y
  Combinator. It publishes no public developer API, OpenAPI definition, SDKs,
  developer portal, or documentation surface.
